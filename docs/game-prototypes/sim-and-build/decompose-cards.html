<tr><td>5</td><td>จั่ว <b>กระป๋องเหล็ก</b> ทีมคิดว่าเหล็กน่าจะทนกว่า จึงวาง <b>หลัง</b> อะลูมิเนียม เฉลยคือระดับ 4 แต่ใบซ้ายคือ 5 → <b>ผิด</b> <b>🌡 +1</b> (ที่ถูกคือวางก่อนอะลูมิเนียม)</td><td>(เหมือนเดิม)</td></tr>
</table>
<div class="key">สังเกต: การ์ดระดับเดียวกันวางสลับกันได้ เช่น กระป๋องเหล็กกับถุงพลาสติก (ระดับ 4 ทั้งคู่) จะวางใบไหนก่อนก็ถูก</div>
<h2>ปรับความยากได้</h2>
<ul>
<li><b>ง่ายขึ้น:</b> ให้ดูเฉลยของใบที่จั่ว 1 ครั้งก่อนวาง · เล่นโดยไม่นับความร้อน</li>
<li><b>ยากขึ้น:</b> เล่นโหมด ข ด้วยความร้อนแค่ 2 ขีด · หรือให้แถวยาว 12 ใบ</li>
<li><b>เพิ่มเนื้อหา:</b> ก่อนวาง ให้ผู้เล่นตอบด้วยว่า “ของชิ้นนี้ควรทิ้งอย่างไร” ตอบถูกทั้งสองข้อจึงนับ</li>
</ul>
`, 'rules'));

/* ---------------- การ์ด: จับคู่ หน้า/หลัง (หลังสลับซ้าย-ขวา เมื่อพลิกด้านยาว) ---------------- */
const pairs = [
  { f: rulerFront, b: rulerBack },
  { f: quickFront, b: LOGO_BACK },
  { f: srcFront, b: LOGO_BACK },
  ...ITEMS.map((it, i) => ({ f: frontHTML(it, i), b: backAnsHTML(it) })),
];

const EMPTY = '<div class="card empty"></div>';
let pages = 4;
const per = 4;
for (let i = 0; i < pairs.length; i += per) {
  const chunk = pairs.slice(i, i + per);
  const fronts = Array(per).fill(EMPTY);
  chunk.forEach((p, k) => { fronts[k] = p.f; });
  add(pageOf(`<div class="grid">${fronts.join('')}</div>`));
  const backs = Array(per).fill(EMPTY);
  chunk.forEach((p, k) => { backs[Math.floor(k / 2) * 2 + (1 - (k % 2))] = p.b; });
  add(pageOf(`<div class="grid">${backs.join('')}</div>`));
  pages += 2;
}

/* ---------------- ตารางเฉลยรวม + หน้าที่มา (หน้า-หลังแผ่นเดียว) ---------------- */
add(pageOf(`
<h1>ตารางเฉลยรวม (สำหรับครู / ผู้ตัดสิน)</h1>
<div>ระดับ = ใช้ตัดสินเกม · เวลา = เวลาโดยประมาณของขยะในทะเล ตามแหล่งในคอลัมน์ “ที่มา”</div>
<table>
<tr><th>#</th><th>สิ่งของ</th><th>ระดับ</th><th>เวลา (ประมาณ)</th><th>ที่มา</th><th>จัดการ</th></tr>
${ITEMS.map((it, i) => `<tr><td>${i + 1}</td><td>${it.e.startsWith('<svg') ? '' : it.e + ' '}${it.name}</td><td><b>${it.tier}</b></td><td>${it.time}${it.note ? `<br><span style="color:#5b6b5d">${it.note}</span>` : ''}</td><td>${it.src}</td><td>${it.tip}</td></tr>`).join('')}
</table>
`, 'sheet'));
add(pageOf(`
<h1>ที่มาของข้อมูล</h1>
<p>เวลาการย่อยสลายบนการ์ดทุกใบ นำมาจากเอกสารด้านล่าง ซึ่งเป็นชุดข้อมูล “ขยะในทะเลอยู่ได้นานแค่ไหน” ที่หน่วยงานของสหรัฐอเมริกาใช้ในงานให้ความรู้ เมื่อแหล่งให้ตัวเลขต่างกัน การ์ดจะแสดงไว้ทั้งสองค่า</p>
<div class="ref"><b>EPA</b> — U.S. Environmental Protection Agency, Gulf of Mexico Program. <i>Marine Debris Timeline</i> (Educator and Student Resources, หน้าเว็บเก็บถาวร พ.ศ. 2551)<br><span class="url">web.archive.org/web/2008/http://www.epa.gov/gmpo/edresources/debris_t.html</span></div>
<div class="ref"><b>NPS</b> — U.S. National Park Service, Tonto National Monument. <i>Marine Lab Timeline</i> (ใบงานครูพร้อมเฉลย)<br><span class="url">www.nps.gov/common/uploads/teachers/lessonplans/Timeline%20(2).pdf</span></div>
<div class="ref"><b>NOAA</b> — NOAA Marine Debris Program, Mote Marine Lab และ U.S. National Park Service (2018). <i>Decomposition rates of marine debris</i> เผยแพร่ผ่าน Our World in Data<br><span class="url">ourworldindata.org/grapher/decomposition-rates-marine-debris</span></div>
<div class="ref"><b>Mote</b> — ตารางเวลาย่อยสลายของ Mote Marine Laboratory ที่อ้างในชุดการเรียนรู้ MARLISCO (โครงการของสหภาพยุโรป) กิจกรรม A2<br><span class="url">marlisco.eu/tl_files/marlisco/mixed-images/educational_pack/Act_A2.pdf</span></div>
<h2>ควรรู้ก่อนนำไปสอน</h2>
<ul>
<li>ทุกแหล่งระบุว่าเป็น <b>เวลาโดยประมาณ</b> เพราะขึ้นกับสภาพแวดล้อม เช่น แดด ความลึก อุณหภูมิ และคลื่น</li>
<li>พลาสติกไม่ได้ “หายไป” เมื่อครบเวลา แต่แตกเป็นชิ้นเล็กจนมองไม่เห็นด้วยตา</li>
<li>ตัวเลขของพลาสติก เช่น ขวด “450 ปี” ยังไม่มีใครวัดได้จริง เพราะพลาสติกเพิ่งใช้แพร่หลายราว 60 ปี GRID-Arendal (องค์กรที่ทำงานร่วมกับโครงการสิ่งแวดล้อมแห่งสหประชาชาติ) อธิบายว่าเป็น “ตัวเลขประกอบการอธิบาย” ที่ช่วยให้เห็นภาพ <span class="url">marinelitter.grida.no/myth9/</span></li>
<li>เกมจึงตัดสินด้วย <b>ระดับ</b> ซึ่งทุกแหล่งตรงกัน ไม่ใช่ตัวเลขปีที่อาจต่างกันระหว่างแหล่ง</li>
</ul>
<h2>สีถังขยะที่ใช้บนการ์ด</h2>
<p>🟢 ถังเขียว = ขยะอินทรีย์ · 🟡 ถังเหลือง = ขยะรีไซเคิล · 🔵 ถังน้ำเงิน = ขยะทั่วไป · 🔴 ถังแดง = ขยะอันตราย — ตรวจกับข้อกำหนดของท้องถิ่นหรือหน่วยงานก่อนใช้จริง</p>
`, 'sheet'));
pages += 2;

document.title = `ย่อยนานแค่ไหน? — ${ITEMS.length} ใบ (พิมพ์สองหน้า)`;
document.querySelector('.toolbar b').textContent += ` · การ์ดสิ่งของ ${ITEMS.length} ใบ + ช่วยเล่น 3 ใบ · ${pages} หน้า (${pages / 2} แผ่น)`;
</script>
</body>
</html>
